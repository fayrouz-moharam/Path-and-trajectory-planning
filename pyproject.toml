[project]
name = "t1-track"
version = "0.1.0"
description = "Task 1: track representation from a perception test-lap log"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["t1_track"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
